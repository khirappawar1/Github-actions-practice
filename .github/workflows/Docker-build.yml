---
name: Docker Build
on:
    push:
        branches: [main, feature/*]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout the code
            uses: actions/checkout@v4

          - name: Set short commit SHA
            id: vars
            run: |
              echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

          - name: setup python
            uses: actions/setup-python@v5
            with:
                python-version: "3.11"
          
          - name: setup docker Buildx
            uses: docker/setup-buildx-action@v3
          
          - name: Build the docker image
           
            run: |
              docker build -t ${{ secrets.DOCKER_USERNAME }}/simpe-app .
              docker build -t ${{ secrets.DOCKER_USERNAME }}/simpe-app:sha-${{ env.SHA_SHORT }} .
          
          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
         
          - name: Push to image to docker hub
            if: github.ref == 'refs/heads/main'
            run: |
              docker push ${{ secrets.DOCKER_USERNAME }}/simpe-app
              docker push ${{ secrets.DOCKER_USERNAME }}/simpe-app:sha-${{ env.SHA_SHORT }}
