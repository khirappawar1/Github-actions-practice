---
name:
on:
    push:
        branches: [main]

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Short SHA
              run:  echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Logini to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker build image
              run: |
                docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-app /
                docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-app:$SHORT_SHA ./Docker-app

            - name: Docker push to docker hub
              if: github.ref == 'refs/heads/main'
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/docker-app
                docker push ${{ secrets.DOCKER_USERNAME }}/docker-app:$SHORT_SHA
              
