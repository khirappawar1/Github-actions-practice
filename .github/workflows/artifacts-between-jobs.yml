---
name: Artifact between jobs
on:
    workflow_dispatch:
jobs:
    Artifact_upload:
        runs-on: ubuntu-latest
        steps:
            - name: upload the artifacts
              run: |
                echo "print the user $(whoami)" > user.txt
            - name: upload the artifacts
              uses: actions/upload-artifact@v4
              with:
                name: test-file
                path: user.txt
    
    Artifact_download:
        runs-on: ubuntu:latest
        needs: Artifact_upload
        steps:
            - name: Download the artifacts
              uses: actions/download-artifact@v4
              with:
                name: test-file
            - name: print the content
              run: cat user.txt
