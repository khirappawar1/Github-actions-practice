---
name: Job Outputs Example

on:
  workflow_dispatch:

jobs:
  set-date:
    runs-on: ubuntu-latest
    outputs:
      today: ${{ steps.get-date.outputs.today }}   # expose output to other jobs
    steps:
      - name: Get today's date
        id: get-date
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "today=$DATE" >> $GITHUB_OUTPUT

  print-date:
    runs-on: ubuntu-latest
    needs: set-date   # depends on set-date job
    steps:
      - name: Print the date from previous job
        run: echo "Today's date is ${{ needs.set-date.outputs.today }}"