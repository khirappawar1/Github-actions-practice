name: smart triggers

on:
  push:
    paths:
      - 'src/**'
      - 'app/**'

jobs:
  print:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print changed files
        run: |
          Files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          for file in $Files; do
            echo "$file"
          done