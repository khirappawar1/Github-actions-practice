---
name: Test-script.sh
on:
  workflow_dispatch:
jobs:
    test-script:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the code
              uses: actions/checkout@v4
            
            - name: Make script executable
              run: chmod +x test-script.sh
            
            - name: run the script
              run: |
                echo "Running the script"
                ./test-script.sh